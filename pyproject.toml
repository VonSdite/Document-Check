[project]
name = "document-check"
version = "0.1.0"
description = "文档智能门禁网站"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Web 应用、进程服务和多进程安全日志。
  "a2wsgi==1.10.10",
  "concurrent-log-handler==0.9.29",
  "flask==3.0.3",
  "markupsafe==3.0.3",
  "portalocker==4.3.0",
  "psutil==7.2.2",
  "uvicorn==0.52.4",
  "werkzeug==3.1.8",
  # 文档解析、模型请求、认证和报告处理。
  "beautifulsoup4==4.12.3",
  "mistune==3.0.2",
  "openpyxl==3.1.5",
  "pymupdf>=1.27.2.3",
  "pypdf[image]==4.3.1",
  "python-docx==1.1.2",
  "pyyaml==6.0.2",
  "requests==2.32.3",
  "xlrd==2.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff==0.16.3",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
