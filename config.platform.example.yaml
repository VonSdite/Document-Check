# 管理入口使用管理员凭据登录；用户身份由 auth.mode 决定。
secret_key: 请替换为随机长字符串
admin:
  username: admin
  password: 请替换为强密码
admin_url: /console
server:
  # 0.0.0.0 表示监听所有网卡；也可以改成服务器指定内网 IP。
  # 对外开放前请务必修改 admin.password、secret_key 和 admin_url。
  host: 0.0.0.0
  port: 31945
  # 如果通过 Nginx 子路径发布，例如 https://example.com/infoCheck，请填写 /infoCheck；根路径发布则留空。
  url_prefix: ""
  # 如果 Nginx 会覆盖并注入真实客户端 IP，例如 proxy_set_header X-Real-IP $remote_addr，可填写 X-Real-IP。
  # 只有确认外部用户无法绕过 Nginx 直连本服务时才启用。
  real_ip_header: X-Real-IP
  # 如果 Nginx 同时注入 X-Forwarded-Proto/Host/Prefix 等标准代理头，可开启。
  proxy_fix: false
  max_upload_mb: 1024
  # Windows 和 Linux 统一使用 Uvicorn；web_workers 控制 Web 进程数。
  # web_threads 控制每个 Web 进程的 Flask 请求线程数。
  web_workers: 1
  web_threads: 16
worker:
  # 管理页面中的“系统同时执行任务数”不能超过该机器级上限。
  max_task_processes: 4
logging:
  # 控制台级别：INFO、WARNING、ERROR、CRITICAL；启动摘要和访问地址始终显示。
  # 文件固定保留 INFO 及以上日志，排查问题时可将控制台设为 INFO。
  console_level: WARNING
network:
  # 系统出站代理模式，控制本服务访问模型 API、拉取模型列表、测试模型连通性等所有对外请求。
  # 可选值：direct、system、custom。direct 为直连；system 读取本机 HTTP_PROXY/HTTPS_PROXY 等环境变量；custom 使用下面 proxy。
  proxy_mode: direct
  # proxy 仅在 proxy_mode: custom 时填写，例如 http://127.0.0.1:7890；用户模型配置里不允许再填写代理。
  proxy: ""
  # 是否校验 HTTPS 证书；默认 false，适合内网或自签名证书服务。公网正式证书环境建议改为 true。
  ssl_verify: false
auth:
  # 可选值：ip、cookie_session。默认先用 ip，接入公司统一登录域后切到 cookie_session。
  # ip：按访问 IP 区分用户；cookie_session：转发浏览器原始 Cookie 到外部用户信息接口换取身份。
  # 任务列表、详情与操作按 owner_subject 隔离；Cookie 登录时自动归属当前 IP 的待迁移数据。
  # ip 模式可在管理员后台给 IP 设置显示用户名。
  mode: ip
  # mode: cookie_session 时填写；应用部署在统一登录主域下，把浏览器原始 Cookie 转发给外部用户信息接口换取身份。
  # mode 只允许 ip、cookie_session；其他值会阻止启动。
  # 接口地址、字段名、头像模板全部在此配置，代码中不硬编码任何厂商信息。
  cookie_session:
    # userinfo_url 是外部用户信息接口完整 URL。应用把原始 Cookie 头转发到此地址换取用户信息。
    userinfo_url: "https://用户信息接口域名/api/user"
    # cookie_header_name 是转发到外部接口的请求头名称，默认 cookie。
    cookie_header_name: cookie
    # 是否校验外部接口 HTTPS 证书；默认 false，适合内网或自签名证书服务。公网正式证书环境建议改为 true。
    ssl_verify: false
    # 调用外部接口的超时秒数。
    timeout: 3
    # 身份缓存有效期秒数，到期后重新向用户信息接口验证。
    cache_ttl: 600
    # 缓存过期后的宽限期秒数；宽限期内允许用过期缓存降级放行，0 表示不降级。
    cache_grace: 600
    # avatar_url_template 是头像地址模板，{user_id} 占位符会被替换为 avatar_field 指定的字段值（通常工号）。
    # 留空则不显示头像。
    avatar_url_template: "https://头像服务域名/face/{user_id}/120"
    # avatar_field 指定从外部接口响应中取哪个字段填充头像模板的 {user_id}；通常填工号字段，留空时用 user_id。
    avatar_field: "工号字段名"
    # field_mapping 把外部接口返回 JSON 的字段名映射到应用内部身份字段。
    field_mapping:
      # user_id 必填，指向跨工号轮换不变的稳定人员标识字段（如 uuid），作为任务归属主键，不要填工号或姓名。
      user_id: "uuid"
      # username 可空，指向显示名字段名；留空时显示 user_id。
      username: "姓名字段名"
      # employee_number 可空，指向工号字段；与姓名一起展示并同步更新。
      employee_number: "工号字段名"
      # 可选扩展字段映射。
      extra_fields: {}
    # 未登录或会话失效时跳转的统一登录地址。cookie_session 模式下必填，否则返回 401。
    login_url: "https://统一登录域名/login"
