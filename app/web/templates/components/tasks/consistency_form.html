<div data-component="task-composer">
<form method="post" enctype="multipart/form-data" class="panel create-panel" autocomplete="off" data-require-checks="true" data-check-required-message="请至少选择一个多文档对照项。">
  <div class="panel-head compact-head">
    <h2>新建任务</h2>
  </div>

  <div class="consistency-form-grid">
    <div class="form-field multi-file-field">
      <span class="field-label">素材文档</span>
      <span class="field-with-help">
        <label class="file-upload-control">
          <input class="file-input" name="master_documents" type="file" accept=".docx,.pdf,.txt,.md,.html,.xlsx,.xlsm,.xls" data-file-limit="5" multiple required>
          <span class="file-name">未选择文件</span>
          <span class="file-clear" role="button" tabindex="0" aria-label="清除文件">×</span>
          <span class="file-button" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
          </span>
        </label>
        <span class="help-tip" tabindex="0" data-tip="选择写作依据或素材内容，可选择 1-5 个 docx、pdf、txt、md、html、xlsx、xlsm、xls 文档。">?</span>
      </span>
      <div class="selected-file-list" data-file-list hidden></div>
    </div>

    <div class="form-field multi-file-field">
      <span class="field-label">资料</span>
      <span class="field-with-help">
        <label class="file-upload-control">
          <input class="file-input" name="related_documents" type="file" accept=".docx,.pdf,.txt,.md,.html,.xlsx,.xlsm,.xls" data-file-limit="3" multiple required>
          <span class="file-name">未选择文件</span>
          <span class="file-clear" role="button" tabindex="0" aria-label="清除文件">×</span>
          <span class="file-button" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
          </span>
        </label>
        <span class="help-tip" tabindex="0" data-tip="选择根据素材文档写作生成、需要核对一致性的资料，可选择 1-3 个 docx、pdf、txt、md、html、xlsx、xlsm、xls 文档。">?</span>
      </span>
      <div class="selected-file-list" data-file-list hidden></div>
    </div>

    <label data-model-field>
      模型
      <select name="model_id" required>
        {% if not models %}
        <option value="" data-no-model-option>暂无可用模型</option>
        {% else %}
          {% for model in models %}
          <option value="{{ model.id }}" data-model-label="{{ model.provider_name }} / {{ model.model_name }}"{% if model.force_disable_thinking %} data-thinking-disabled="true"{% endif %}>{{ model.provider_name }} / {{ model.model_name }}{{ "（关闭思考）" if model.force_disable_thinking else "" }}</option>
          {% endfor %}
        {% endif %}
      </select>
    </label>

    <div class="submit-slot">
      <button class="primary-button" type="submit">提交检查</button>
    </div>
  </div>
  {% with check_label="多文档对照项", check_help="可多选；系统会按检查项逐项调用模型比对素材文档和资料。", check_first_only=true %}
    {% include "_task_check_picker.html" %}
  {% endwith %}
</form>
</div>
