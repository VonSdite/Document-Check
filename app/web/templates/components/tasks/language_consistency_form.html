<div data-component="task-composer">
<form method="post" enctype="multipart/form-data" class="panel create-panel" autocomplete="off" data-require-checks="true" data-check-required-message="请至少选择一个跨语种检查项。" data-prevent-double-submit="true" data-submitting-label="提交中..." data-submitting-message="正在上传并读取两份文档，请勿重复提交。">
  <input type="hidden" name="submission_token" value="{{ submission_token }}">
  <div class="panel-head compact-head">
    <h2>新建任务</h2>
  </div>

  <div class="consistency-form-grid">
    <div class="form-field">
      <span class="field-label">文档A</span>
      <span class="field-with-help">
        <label class="file-upload-control">
          <input class="file-input" name="document_a" type="file" accept=".docx,.pdf,.txt,.md,.html,.xlsx,.xlsm,.xls" required>
          <span class="file-name">未选择文件</span>
          <span class="file-clear" role="button" tabindex="0" aria-label="清除文件">×</span>
          <span class="file-button" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
          </span>
        </label>
        <span class="help-tip" tabindex="0" data-tip="上传其中一个语种或版本的资料文档，支持 docx、pdf、txt、md、html、xlsx、xlsm、xls。">?</span>
      </span>
    </div>

    <div class="form-field">
      <span class="field-label">文档B</span>
      <span class="field-with-help">
        <label class="file-upload-control">
          <input class="file-input" name="document_b" type="file" accept=".docx,.pdf,.txt,.md,.html,.xlsx,.xlsm,.xls" required>
          <span class="file-name">未选择文件</span>
          <span class="file-clear" role="button" tabindex="0" aria-label="清除文件">×</span>
          <span class="file-button" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
          </span>
        </label>
        <span class="help-tip" tabindex="0" data-tip="上传另一语种或版本的资料文档，系统会先生成静态预检摘要，再调用模型输出中文差异报告。">?</span>
      </span>
    </div>

    <label data-model-field>
      模型
      <select name="model_id" required>
        {% if not models %}
        <option value="" data-no-model-option>暂无可用模型</option>
        {% else %}
          {% for model in models %}
          <option value="{{ model.id }}" data-model-label="{{ model.provider_name }} / {{ model.model_name }}"{% if model.force_disable_thinking %} data-thinking-disabled="true"{% endif %}>{{ model.provider_name }} / {{ model.model_name }}{{ "（关闭思考）" if model.force_disable_thinking else "" }}</option>
          {% endfor %}
        {% endif %}
      </select>
    </label>

    <div class="submit-slot">
      <button class="primary-button" type="submit">提交检查</button>
      <span class="submit-progress" data-submit-progress hidden>正在上传并读取两份文档，请勿重复提交。</span>
    </div>
  </div>
  {% with check_label="跨语种检查项", check_help="系统会先静态抽取数字、版本、链接、标题和长度线索，再按检查项调用模型生成中文报告。" %}
    {% include "_task_check_picker.html" %}
  {% endwith %}
</form>
</div>
