<div data-component="task-composer">
<form method="post" enctype="multipart/form-data" class="panel create-panel" data-require-checks="true" data-check-required-message="请至少选择一个图片检查项。">
  <div class="panel-head compact-head">
    <h2>新建任务</h2>
  </div>

  <div class="quick-form-grid">
    <div class="form-field">
      <span class="field-label">文档</span>
      <span class="field-with-help">
        <label class="file-upload-control">
          <input class="file-input" name="document" type="file" accept=".pdf" required>
          <span class="file-name">未选择文件</span>
          <span class="file-clear" role="button" tabindex="0" aria-label="清除文件">×</span>
          <span class="file-button" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
          </span>
        </label>
        <span class="help-tip" tabindex="0" data-tip="图片检查仅支持 PDF，会生成页面截图并提取文档文本用于图文联合检查；单文件最大 {{ max_upload_mb }}MB。">?</span>
      </span>
    </div>
    <label>
      多模态模型
      <select name="model_id" required>
        {% if not models %}
        <option value="">暂无可用模型</option>
        {% else %}
          {% for model in models %}
          <option value="{{ model.id }}" data-model-label="{{ model.provider_name }} / {{ model.model_name }}"{% if model.force_disable_thinking %} data-thinking-disabled="true"{% endif %}>{{ model.provider_name }} / {{ model.model_name }}{{ "（关闭思考）" if model.force_disable_thinking else "" }}</option>
          {% endfor %}
        {% endif %}
      </select>
    </label>
    <div class="submit-slot">
      <button class="primary-button" type="submit">提交检查</button>
    </div>
  </div>
  {% with check_label="图片检查项", check_help="系统会按页面截图和图片资源分组检查，每批最多 4 张图，并只带当前页附近文本给多模态模型，减少跨页误配。" %}
    {% include "_task_check_picker.html" %}
  {% endwith %}
</form>
</div>
