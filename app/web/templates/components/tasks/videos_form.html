<div data-component="task-composer">
<form method="post" enctype="multipart/form-data" class="panel create-panel" data-require-checks="true" data-check-required-message="请至少选择一个视频检查项。" data-prevent-double-submit="true" data-submitting-label="正在创建..." data-submitting-message="正在上传视频并创建任务，请勿重复提交。" data-require-image-model="true" data-model-required-message="请先在模型管理中完成图片识别测试。" data-model-help="视频检查通过识别视频画面完成，只能使用通过图片识别测试的模型。请在模型管理中点击“测试图片识别”，通过后保存模型配置。" data-model-management-url="{{ url_for('user_models') }}">
  <div class="panel-head compact-head">
    <h2>新建任务</h2>
  </div>

  <div class="quick-form-grid">
    <div class="form-field multi-file-field">
      <span class="field-label">视频</span>
      <span class="field-with-help">
        <label class="file-upload-control">
          <input class="file-input" name="video" type="file" accept=".mp4,.mov,.mkv,.webm,.avi,.m4v" multiple required>
          <span class="file-name">未选择文件</span>
          <span class="file-clear" role="button" tabindex="0" aria-label="清除文件">×</span>
          <span class="file-button" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
          </span>
        </label>
        <span class="help-tip" tabindex="0" data-tip="支持一次选择多个 mp4、mov、mkv、webm、avi、m4v 视频，每个视频独立抽帧并创建任务；单次上传总大小上限为 {{ max_upload_mb }}MB。">?</span>
      </span>
      <div class="selected-file-list" data-file-list hidden></div>
    </div>
    <label>
      视频画面识别模型
      <select name="model_id" required>
        {% if not models %}
        <option value="">暂无通过图片识别测试的模型</option>
        {% else %}
          {% for model in models %}
          <option value="{{ model.id }}" data-model-label="{{ model.provider_name }} / {{ model.model_name }}"{% if model.force_disable_thinking %} data-thinking-disabled="true"{% endif %}>{{ model.provider_name }} / {{ model.model_name }}{{ "（关闭思考）" if model.force_disable_thinking else "" }}</option>
          {% endfor %}
        {% endif %}
      </select>
    </label>
    <div class="submit-slot">
      <button class="primary-button" type="submit"{% if not models %} disabled{% endif %}>提交检查</button>
      <div class="submit-progress" data-submit-progress hidden>正在上传视频并创建任务，请勿重复提交。</div>
    </div>
  </div>
  <p class="subline">视频检查需要能识别图片的模型，请先完成图片识别测试。<a href="{{ url_for('user_models') }}">前往模型管理</a></p>
  {% with check_label="视频检查项", check_help="系统会抽取视频画面分批检查，重点检查硬件安装顺序、接线端子、安全防护、调测界面和视频完整性。" %}
    {% include "_task_check_picker.html" %}
  {% endwith %}
</form>
</div>
