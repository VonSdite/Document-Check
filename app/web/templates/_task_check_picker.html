<div class="check-row">
  <div class="check-row-title">
    <span>{{ check_label }}</span>
    <span class="help-tip" tabindex="0" data-tip="{{ check_help }}">?</span>
  </div>
  <div class="check-chip-grid">
    {% for item in check_items %}
    <label class="check-chip">
      <input type="checkbox" name="checks" value="{{ item.id }}"{% if not check_first_only|default(false) or loop.first %} checked{% endif %} autocomplete="off">
      <span>{{ item.name }}</span>
      <span class="help-tip check-chip-tip" tabindex="0" data-tip="{{ item.description or item.name }}">?</span>
    </label>
    {% else %}
    <div class="empty-state compact">
      <h3>暂无可用{{ check_label }}</h3>
    </div>
    {% endfor %}
  </div>
</div>
