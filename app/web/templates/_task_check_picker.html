<div class="check-row">
  <div class="check-row-title">
    <span>{{ check_label }}</span>
    <span class="help-tip" tabindex="0" data-tip="{{ check_help }}">?</span>
  </div>
  <div class="check-chip-grid">
    {% for item in check_items %}
    <label class="check-chip">
      <input type="checkbox" name="checks" value="{{ item.id }}"{% if item.profile_selected|default(item.default_selected|default(true)) and (not check_first_only|default(false) or loop.first) %} checked{% endif %}{% if task_check_profiles is defined %} disabled{% endif %} autocomplete="off">
      <span>{{ item.name }}</span>
      <span class="help-tip check-chip-tip" tabindex="0" data-tip="{{ item.description or item.name }}">?</span>
      {% if task_check_profiles is defined %}<input type="hidden" name="checks" value="{{ item.id }}">{% endif %}
    </label>
    {% else %}
    <input class="check-validation-input" data-check-validation aria-label="{{ check_label }}" tabindex="-1" required>
    <div class="empty-state compact">
      <h3>暂无可用{{ check_label }}</h3>
    </div>
    {% endfor %}
  </div>
</div>
