{% set round_settings = document_check_round_settings() %}
<label>
  <span class="field-with-help">
    <span>检查轮数</span>
    <span class="help-tip" tabindex="0" data-tip="每轮完成业务规则检查，并根据疑点自主补查。多轮增加不同检查侧重点，复用已核实的相同判断，合并为一份报告。本地规则执行一次。增加轮数会增加耗时和模型用量。">?</span>
  </span>
  <select name="check_rounds" required>
    {% for round_number in range(1, round_settings.maximum + 1) %}
    <option value="{{ round_number }}"{% if round_number == round_settings.default %} selected{% endif %}>{{ round_number }} 轮</option>
    {% endfor %}
  </select>
</label>
