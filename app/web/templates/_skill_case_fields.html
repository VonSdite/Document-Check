<div class="form-grid">
  <label>案例类型
    <select name="case_kind">
      <option value="positive"{% if (case_data.case_kind or case_data.kind or 'positive') == 'positive' %} selected{% endif %}>真实问题</option>
      <option value="negative"{% if (case_data.case_kind or case_data.kind) == 'negative' %} selected{% endif %}>正确反例（应放行）</option>
    </select>
  </label>
  <label class="switch-line"><input type="checkbox" name="reviewed"{% if case_data.reviewed %} checked{% endif %}>已人工核对证据、适用条件和期望结果</label>
</div>
{% for key, label in case_fields %}
<label>{{ label }}
  {% if key in ['title', 'reference', 'location'] %}
  <input name="{{ key }}" value="{{ case_data[key] or '' }}" maxlength="8000" required>
  {% else %}
  <textarea name="{{ key }}" rows="{{ 8 if key == 'document_text' else 3 }}" maxlength="{{ 250000 if key == 'document_text' else 8000 }}"{% if key != 'corrected_text' %} required{% endif %}>{{ case_data[key] or '' }}</textarea>
  {% endif %}
</label>
{% endfor %}
